name: Release

# Solo manual: el publish local (scripts/publish-release.ps1) es la fuente de verdad.
# El trigger por tag pisaba el Setup bueno con un build de Actions a veces truncado.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión sin v (ej. 0.3.65)'
        required: true
        default: '0.3.65'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          EPUBLISH: never

      - name: Verify update metadata matches installer
        shell: pwsh
        run: |
          $pathLine = Get-Content release/latest.yml | Where-Object { $_ -match '^path:' } | Select-Object -First 1
          if (-not $pathLine) { throw 'latest.yml no contiene path' }
          $expected = ($pathLine -replace '^path:\s*', '').Trim()
          if (-not (Test-Path "release/$expected")) {
            Write-Error "latest.yml apunta a '$expected' pero no existe en release/"
            Get-ChildItem release
            exit 1
          }
          $yml = Get-Content release/latest.yml -Raw
          if ($yml -notmatch ('version:\s*' + [regex]::Escape('${{ inputs.version }}'))) {
            throw "latest.yml no coincide con version ${{ inputs.version }}"
          }
          $exe = Get-Item "release/$expected"
          if ($exe.Length -lt 100MB) {
            throw "Setup demasiado chico: $($exe.Length) bytes"
          }
          Write-Host "OK: latest.yml -> $expected ($([math]::Round($exe.Length/1MB,2)) MB)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: ControlStock v${{ inputs.version }}
          generate_release_notes: false
          body: |
            ## ControlStock v${{ inputs.version }}

            Release generado desde GitHub Actions (manual).

            ### Instalación
            1. Cerrá ControlStock.
            2. PC: Configuración → Buscar actualizaciones, o instalá el Setup.
            3. Celular: APK de este release.

            Importante: actualizá primero el servidor, después los clientes.
          files: |
            release/ControlStock-Setup-*.exe
            release/latest.yml
            release/ControlStock-*.apk
